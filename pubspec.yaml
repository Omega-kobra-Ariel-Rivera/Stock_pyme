name: nutrysleep
description: "NutrySleep - Kit de sueño de Rivera Systems (familia NutryScan)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Ícono de la app (se genera en GitHub Actions)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D1222"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Pantalla nativa al abrir (evita el destello blanco)
flutter_native_splash:
  color: "#0D1222"
  image: assets/icon/logo.png
  android_12:
    color: "#0D1222"
    image: assets/icon/splash_android12.png
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/brand/
